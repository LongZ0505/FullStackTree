server:
  port: 8888
app:
  api-prefix: /api/v1
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: tree_identity_service
          uri: http://localhost:8080
          predicates:
            - Path=${app.api-prefix}/identity/**
          filters:
            - StripPrefix=2
        - id: post_service
          uri: http://localhost:8081
          predicates:
            - Path=${app.api-prefix}/post/**
          filters:
            - StripPrefix=2
        - id: follow_service
          uri: http://localhost:8082
          predicates:
            - Path=${app.api-prefix}/follow/**
          filters:
            - StripPrefix=2
        - id: chat_service
          uri: http://localhost:8083
          predicates:
            - Path=${app.api-prefix}/chat/**
          filters:
            - StripPrefix=2
        - id: notification_service
          uri: http://localhost:8085
          predicates:
            - Path=${app.api-prefix}/notification/**
          filters:
            - StripPrefix=2
